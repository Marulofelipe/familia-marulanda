<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familia Marulanda — Entrenamiento y alimentación</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO — tomado de Google Stitch (DESIGN.md aprobado)
   "Living Room Fitness & Habits" · estilo Apple / tvOS · 10-foot UI
   Convertido a CSS propio: SIN Tailwind, SIN Google Fonts, SIN
   iconos externos → funciona en el televisor aunque se caiga el internet.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* lienzos */
  --lienzo:#F5F6F8; --tarjeta:#FFFFFF; --pozo:#F9FAFB; --inactivo:#E5E7EB;
  /* acentos */
  --azul:#2563EB; --verde:#059669; --naranja:#EA580C; --morado:#7C3AED;
  --teal:#10B981; --agua:#0284C7; --rojo:#DC2626;
  /* texto */
  --t1:#111827; --t2:#6B7280; --t3:#9CA3AF; --t4:#4B5563;
  /* tintes de iconos */
  --tin-morado:#F3E8FF; --tin-azul:#DBEAFE; --tin-verde:#D1FAE5;
  --tin-naranja:#FFEDE7; --tin-agua:#E0F2FE;
  /* geometría */
  --r-tarjeta:24px; --r-celda:14px; --r-pastilla:9999px;
  /* sombras Stitch */
  --s-reposo:0 10px 25px -5px rgba(20,27,43,.05), 0 8px 10px -6px rgba(20,27,43,.02);
  --s-foco:0 20px 35px -5px rgba(37,99,235,.18), 0 12px 16px -8px rgba(37,99,235,.10);
  /* tipografía: Inter si está, si no una sans del sistema */
  --fuente:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--fuente);margin:0;background:var(--lienzo);color:var(--t1);
     padding-bottom:80px;font-size:18px;line-height:26px;letter-spacing:.005em;
     -webkit-font-smoothing:antialiased;}
::selection{background:#DBE1FF;}

/* ---------- BARRA SUPERIOR (TopNavBar de Stitch) ---------- */
.barra-sup{background:var(--tarjeta);border-bottom:1px solid #EEF0F4;
  padding:20px 40px;display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:30;}
.marca{display:flex;align-items:center;gap:12px;}
.marca .sello{width:52px;height:52px;border-radius:var(--r-pastilla);background:var(--azul);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.marca b{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:36px;}
.nav-pildora{display:flex;align-items:center;gap:4px;background:#F1F3FF;padding:6px;
  border-radius:var(--r-pastilla);}
.nav-pildora button{border:0;border-radius:var(--r-pastilla);padding:12px 26px;font-size:18px;
  font-weight:600;font-family:inherit;background:transparent;color:var(--t2);cursor:pointer;
  transition:all .18s ease;white-space:nowrap;}
.nav-pildora button:hover{background:#fff;color:var(--t1);transform:scale(1.03);}
.nav-pildora button.on{background:var(--azul);color:#fff;box-shadow:0 6px 14px -4px rgba(37,99,235,.45);}
.usuario-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E5E7EB;
  border-radius:var(--r-pastilla);padding:8px 18px;cursor:pointer;font-family:inherit;font-size:18px;
  font-weight:600;color:var(--t1);transition:all .18s ease;}
.usuario-chip:hover{transform:scale(1.04);border-color:var(--azul);}
.usuario-chip .ini{width:40px;height:40px;border-radius:var(--r-pastilla);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;}
.reloj{background:#F1F3FF;border-radius:var(--r-pastilla);padding:10px 22px;font-size:18px;
  font-weight:700;color:var(--t1);border:1px solid rgba(195,198,215,.25);}

/* ---------- LIENZO ---------- */
main{max-width:1920px;margin:0 auto;padding:28px 40px 40px;}
.hero{text-align:center;margin-bottom:36px;}
.hero h1{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:64px;margin:0 0 8px;}
.hero p{font-size:24px;font-weight:500;line-height:34px;color:var(--t2);margin:0 auto;max-width:640px;}

/* ---------- TARJETAS Y BOTONES (reglas de Stitch) ---------- */
.tarjeta{background:var(--tarjeta);border-radius:var(--r-tarjeta);padding:28px;
  box-shadow:var(--s-reposo);border:2px solid transparent;transition:all .2s ease;}
.tarjeta.plana{border-color:rgba(229,231,235,.9);}
.boton{min-height:56px;padding:14px 28px;border:0;border-radius:var(--r-pastilla);font-size:18px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--azul);color:#fff;
  transition:all .18s ease;display:inline-flex;align-items:center;justify-content:center;gap:10px;}
.boton:hover{transform:scale(1.04);}
.boton.verde{background:var(--verde);} .boton.gris{background:#fff;color:var(--t1);border:1.5px solid var(--inactivo);}
.boton.fantasma{background:#fff;color:var(--azul);border:1.5px dashed var(--azul);}
.boton.grande{min-height:64px;font-size:22px;padding:16px 34px;}
.boton.rojo{background:var(--rojo);}
.mini{min-height:44px;padding:10px 18px;border:0;border-radius:var(--r-pastilla);font-size:18px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--verde);color:#fff;transition:all .15s ease;}
.mini:hover{transform:scale(1.05);}
.mini.azul{background:var(--azul);} .mini.gris{background:var(--inactivo);color:var(--t1);}
.mini.rojo{background:#FEE2E2;color:var(--rojo);}

/* foco estilo control de TV */
.foco{outline:none;}
.foco:focus,.foco:focus-within{transform:scale(1.03);box-shadow:var(--s-foco);border-color:var(--azul)!important;}

/* ---------- PANTALLA 1: INICIO ---------- */
.secciones{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.opcion{display:flex;align-items:center;justify-content:space-between;gap:24px;cursor:pointer;}
.opcion .izq{display:flex;align-items:center;gap:24px;min-width:0;}
.placa{width:76px;height:76px;border-radius:var(--r-pastilla);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:transform .18s ease;}
.opcion:hover .placa{transform:scale(1.06);}
.opcion .txt b{font-size:28px;font-weight:600;line-height:36px;letter-spacing:-.005em;display:block;}
.opcion .txt small{font-size:20px;line-height:28px;color:var(--t2);display:block;margin-top:2px;}
.etiqueta{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:var(--r-pastilla);
  font-size:18px;font-weight:600;margin-left:14px;vertical-align:middle;}
.flecha{width:56px;height:56px;border-radius:var(--r-pastilla);background:#F1F3FF;color:var(--t2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s ease;}
.opcion:hover .flecha{background:var(--azul);color:#fff;}

/* ---------- PANTALLA 2: PERSONAS ---------- */
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.per{cursor:pointer;text-align:center;padding:32px 20px;border-radius:var(--r-tarjeta);}
.per .ini{width:96px;height:96px;border-radius:24px;color:#fff;font-size:44px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.per b{font-size:28px;font-weight:600;letter-spacing:-.005em;}
.per small{display:block;font-size:18px;color:var(--t2);margin-top:6px;}
.per.agregar{border-style:dashed;border-color:var(--azul);background:#EFF6FF;color:var(--azul);}
.per.agregar .ini{background:#DBEAFE;color:var(--azul);}

/* ---------- PESTAÑAS ---------- */
.pestanas{display:flex;gap:4px;background:#F1F3FF;padding:6px;border-radius:var(--r-pastilla);
  margin:0 0 24px;flex-wrap:wrap;}
.pestanas button{flex:1;min-width:150px;}

/* ---------- PANTALLA 3: HOY ---------- */
.reja3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
@media(max-width:1000px){.reja3{grid-template-columns:1fr;}}
.casilla{cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
  gap:24px;min-height:230px;padding:28px;}
.casilla .arriba{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.casilla h2{font-size:28px;font-weight:700;line-height:36px;letter-spacing:-.005em;margin:0;}
.casilla .sub{font-size:18px;color:var(--t2);margin:6px 0 0;}
.insignia{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:var(--r-pastilla);
  font-size:18px;font-weight:600;color:#fff;background:var(--verde);box-shadow:0 4px 10px -2px rgba(5,150,105,.4);}
.casilla.hecho{border-color:rgba(5,150,105,.4);
  background:linear-gradient(180deg,rgba(5,150,105,.06),rgba(5,150,105,0) 60%),var(--tarjeta);}
.casilla.encurso{border-color:rgba(2,132,199,.3);
  background:linear-gradient(180deg,rgba(2,132,199,.06),rgba(2,132,199,0) 60%),var(--tarjeta);}
.kicker{font-size:18px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;}

/* contador de agua */
.medidor{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid rgba(195,198,215,.4);
  padding:6px;border-radius:var(--r-pastilla);box-shadow:0 2px 6px -2px rgba(20,27,43,.06);}
.medidor .n{font-size:28px;font-weight:700;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;}
.redondo{width:48px;height:48px;border-radius:var(--r-pastilla);border:0;cursor:pointer;font-size:24px;
  font-weight:700;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s ease;}
.redondo:hover{transform:scale(1.08);}
.redondo.mas{background:var(--agua);color:#fff;} .redondo.menos{background:#F1F3FF;color:var(--agua);}
.pista{width:100%;background:#E2E8F0;height:16px;border-radius:var(--r-pastilla);overflow:hidden;padding:2px;}
.pista i{display:block;height:100%;background:var(--agua);border-radius:var(--r-pastilla);transition:width .3s ease;}

/* métricas gigantes */
.metrica{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 28px;}
.metrica .num{font-size:56px;font-weight:800;line-height:64px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:10px;}
.metrica .num small{font-size:28px;font-weight:600;}
.metrica p{font-size:20px;font-weight:500;color:var(--t4);margin:4px 0 0;}
.metrica .ico{width:64px;height:64px;border-radius:var(--r-pastilla);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;}

/* calendario */
.cal-cabeza{display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:24px;}
.cal-cabeza h3{font-size:28px;font-weight:700;letter-spacing:-.005em;margin:0;display:flex;align-items:center;gap:10px;}
.leyenda{display:flex;align-items:center;gap:22px;font-size:18px;color:var(--t2);flex-wrap:wrap;}
.leyenda i{width:18px;height:18px;border-radius:6px;display:inline-block;margin-right:7px;vertical-align:-3px;}
.cal{display:grid;gap:14px;width:100%;}
.cal.c14{grid-template-columns:repeat(14,minmax(0,1fr));}
.cal.c28{grid-template-columns:repeat(7,minmax(0,1fr));}
.dia{display:flex;flex-direction:column;align-items:center;gap:8px;}
.dia span{font-size:18px;font-weight:600;color:var(--t2);}
.dia .caja{width:100%;aspect-ratio:1;min-width:52px;min-height:52px;border-radius:var(--r-celda);
  background:var(--inactivo);color:var(--t3);display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease;}
.dia .caja:hover{transform:scale(1.1);}
.dia.ok .caja{background:var(--verde);color:#fff;box-shadow:0 4px 10px -3px rgba(5,150,105,.45);}
.dia.hoy span{color:var(--naranja);font-weight:700;}
.dia.hoy .caja{box-shadow:0 0 0 4px var(--naranja);transform:scale(1.05);}
@media(max-width:760px){.cal.c14{grid-template-columns:repeat(7,minmax(0,1fr));}}

/* ---------- PANTALLA 4: RUTINA ---------- */
.ej{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid #F1F3F5;}
.ej:last-child{border-bottom:0;}
.ej .num{font-size:24px;font-weight:800;color:var(--azul);width:36px;text-align:center;flex-shrink:0;}
.ej img{width:112px;height:112px;object-fit:contain;background:var(--pozo);border-radius:18px;flex-shrink:0;}
.ej .cuerpo{flex:1;min-width:0;}
.ej .cuerpo b{font-size:22px;font-weight:600;line-height:30px;display:block;}
.ej .cuerpo small{display:block;font-size:18px;color:var(--t2);margin-top:5px;}
.chip{display:inline-block;background:#EFF6FF;color:var(--azul);font-size:16px;font-weight:600;
  padding:4px 12px;border-radius:var(--r-pastilla);margin:4px 6px 0 0;}
.ej .acciones{display:flex;gap:8px;flex-shrink:0;}
.fila-botones{display:flex;gap:14px;flex-wrap:wrap;}
.fila-botones .boton{flex:1;min-width:220px;}

/* ---------- PANTALLA 5: COMIDA ---------- */
.tabla{width:100%;border-collapse:collapse;font-size:20px;}
.tabla td{padding:14px 0;border-bottom:1px solid #F1F3F5;}
.tabla tr:last-child td{border-bottom:0;}
.tabla td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
.plato{display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
.plato .dib{flex-shrink:0;}
.plato .lista{flex:1;min-width:240px;}
.plato .lista b{font-size:20px;display:block;margin-top:14px;}
.plato .lista b:first-child{margin-top:0;}
.plato .lista span{font-size:18px;color:var(--t2);}

/* ---------- PANTALLA 6: PROGRESO ---------- */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px;}
.chip-num{text-align:center;padding:26px 18px;}
.chip-num b{display:block;font-size:48px;font-weight:800;line-height:56px;letter-spacing:-.02em;
  color:var(--azul);font-variant-numeric:tabular-nums;}
.chip-num small{font-size:18px;color:var(--t2);}

/* ---------- AVISOS ---------- */
.aviso{font-size:18px;color:var(--t2);line-height:26px;margin-top:16px;}
.nota{background:#FFF7ED;border-left:5px solid var(--naranja);padding:18px 22px;border-radius:16px;
  font-size:20px;margin-top:20px;line-height:28px;}
.ok{background:#ECFDF5;border-left:5px solid var(--verde);padding:18px 22px;border-radius:16px;
  font-size:20px;margin-top:20px;line-height:28px;}
.vacio{text-align:center;padding:48px 20px;color:var(--t2);}
.vacio .ico{font-size:56px;margin-bottom:12px;}

/* ---------- MODAL BIBLIOTECA ---------- */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;z-index:60;padding:20px;overflow-y:auto;}
.modal.on{display:block;}
.modal .caja{background:#fff;border-radius:28px;padding:28px;max-width:820px;margin:24px auto;}
.modal h2{font-size:28px;font-weight:700;margin:0 0 18px;}
input,select{width:100%;padding:14px 18px;font-size:20px;font-family:inherit;border:1.5px solid #D1D5DB;
  border-radius:16px;background:#fff;color:var(--t1);}
input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(37,99,235,.15);}
label{display:block;font-size:18px;font-weight:600;margin:14px 0 6px;}
.fila{display:flex;gap:16px;} .fila>div{flex:1;}
.res{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid #F1F3F5;}
.res img{width:88px;height:88px;object-fit:contain;background:var(--pozo);border-radius:14px;flex-shrink:0;}
.res .cuerpo{flex:1;min-width:0;} .res .cuerpo b{font-size:20px;font-weight:600;}
.res .cuerpo small{display:block;font-size:18px;color:var(--t2);margin-top:4px;}
.check{display:flex;align-items:center;gap:12px;font-weight:400;font-size:18px;margin-top:18px;cursor:pointer;}
.check input{width:24px;height:24px;flex-shrink:0;}

/* ---------- CRONÓMETRO ---------- */
.cron{position:sticky;bottom:16px;max-width:900px;margin:20px auto 0;background:#fff;
  border-radius:28px;padding:24px;border:2px solid var(--azul);box-shadow:0 -6px 28px rgba(20,27,43,.10);
  text-align:center;}
.cron .fase{font-size:18px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.cron .cuenta{font-size:36px;font-weight:800;color:var(--naranja);height:44px;}
.cron .tiempo{font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.cron .botones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;}

/* ---------- PIE ---------- */
.pie{margin-top:32px;padding:20px 40px;border-top:1px solid #EEF0F4;display:flex;
  align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--t2);font-size:18px;}
.pie .sinc{display:flex;align-items:center;gap:10px;color:var(--t4);font-weight:500;}
.punto{width:12px;height:12px;border-radius:50%;background:var(--verde);display:inline-block;}

/* ---------- MÓVIL ---------- */
@media(max-width:700px){
  body{font-size:16px;line-height:24px;}
  .barra-sup{padding:12px 14px;flex-wrap:wrap;gap:8px;} .marca b{font-size:18px;} 
  .marca span{font-size:12px;display:block;}
  main{padding:14px 12px 24px;}
  .secciones{gap:14px;}
  .hero{padding:24px 16px;border-radius:16px;}
  .hero h1{font-size:28px;line-height:34px;} .hero p{font-size:16px;}
  .opcion{padding:16px;gap:14px;}
  .opcion .txt b{font-size:20px;} .opcion .txt small{font-size:14px;}
  .placa{width:56px;height:56px;}
  .placa svg{width:28px;height:28px;}
  .nav-pildora{gap:4px;width:100%;overflow-x:auto;justify-content:flex-start;}
  .nav-pildora button{padding:8px 12px;font-size:14px;min-width:auto;}
  .personas{grid-template-columns:repeat(2,1fr);gap:12px;}
  .per{padding:16px 10px;} .per .ini{width:56px;height:56px;font-size:24px;border-radius:14px;}
  .per b{font-size:18px;}
  .reja3{grid-template-columns:1fr;gap:14px;}
  .casilla{min-height:auto;padding:16px;gap:12px;}
  .casilla h2{font-size:20px;line-height:26px;} .casilla .sub{font-size:14px;}
  .pestanas{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .pestanas button{min-width:auto;flex:0 0 auto;padding:8px 12px;font-size:14px;}
  .ej{flex-wrap:wrap;gap:10px;} .ej img{width:80px;height:80px;}
  .ej .detalle{font-size:14px;}
  .cal.c14{grid-template-columns:repeat(7,1fr);gap:4px;}
  .dia{padding:8px 2px;font-size:12px;}
  .pie{padding:12px;font-size:12px;flex-wrap:wrap;gap:8px;}
}
</style>

</head>
<body>

<!-- ═══ BARRA SUPERIOR (TopNavBar de Stitch) ═══ -->
<header class="barra-sup" id="barraSup" style="display:none">
  <div class="marca">
    <div class="sello" id="selloMarca"></div>
    <b id="titulo">Familia Marulanda</b>
    <span id="subtitulo" style="font-size:14px;color:var(--t2);margin-left:8px"></span>
  </div>
  <nav class="nav-pildora" aria-label="Navegación principal">
    <button onclick="pestana='hoy';pintar()" id="navHoy">Hoy</button>
    <button onclick="pestana='rutina';pintar()" id="navRutina">Mi rutina</button>
    <button onclick="pestana='comer';pintar()" id="navComer">Mi comida</button>
    <button onclick="pestana='progreso';pintar()" id="navProgreso">Mi progreso</button>
  </nav>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="zonaUsuario"></span>
    <div class="reloj" id="reloj">--:--</div>
  </div>
</header>

<main>
  <div id="vista"></div>
</main>

<footer class="pie">
  <div style="display:flex;align-items:center;gap:10px">
    <span id="pieTitulo">Familia Marulanda</span>
    <span id="pieSeccion" style="color:var(--t3)"></span>
  </div>
  <div class="sinc"><span class="punto"></span><span id="estadoSinc">Guardado solo en este aparato</span></div>
</footer>

<!-- ============ CRONÓMETRO ============ -->
<div class="cron" id="cajaCron" style="max-width:900px;margin:14px auto 0;">
  <div class="fase" id="fase">Cronómetro listo</div>
  <div class="cuenta" id="cuenta"></div>
  <div class="tiempo" id="tiempo">0:40</div>
  <div>
    <button onclick="iniciar(40,20,8)">▶ 40s / 20s × 8</button>
    <button onclick="iniciar(30,30,6)">▶ 30s / 30s × 6</button>
    <button onclick="iniciar(60,20,6)">▶ 60s / 20s × 6</button>
    <button class="gris" onclick="parar()">■ Parar</button>
  </div>
</div>

function ico(n){ return ICO[n] || ''; }

/* ══════════════ 1. NAVEGACIÓN ══════════════ */
const SECCIONES = {
  saltar:{ titulo:'Saltar en casa', ico:'sprint', color:'var(--morado)', tinte:'var(--tin-morado)',
           texto:'El reto de 21 días de jumping de Silvia.', etiqueta:'21 días' },
  gym:   { titulo:'Gimnasio',        ico:'pesa',  color:'var(--azul)', tinte:'var(--tin-azul)',
           texto:'Abre openGym en el servidor de la casa.', etiqueta:'Servidor local' },
  casa:  { titulo:'Gimnasio en casa',ico:'casa',  color:'var(--teal)', tinte:'var(--tin-verde)',
           texto:'Una pesa, flexiones y peso del cuerpo. 1.324 ejercicios con GIF.', etiqueta:null }
};

function irA(p){ pantalla = p; if(p==='inicio'){ seccionElegida=null; personaActual=null; } pintar(); }

/* ══════════════ 2. PINTAR ══════════════ */
function pintar(){
  const v = document.getElementById('vista');
  document.getElementById('cajaCron').style.display = (pantalla==='persona') ? '' : 'none';
  document.getElementById('barraSup').style.display = (pantalla==='persona') ? '' : 'none';

  if(pantalla === 'inicio'){
    document.getElementById('titulo').textContent = 'Familia Marulanda';
    document.getElementById('subtitulo').textContent = 'Entrenamiento y alimentación de la familia';
    v.innerHTML = pantallaInicio();
    return;
  }
  if(pantalla === 'seccion'){
    const s = SECCIONES[seccionElegida];
    document.getElementById('titulo').textContent = s.titulo;
    document.getElementById('subtitulo').textContent = 'Elige quién va a entrenar';
    v.innerHTML = '<button class="boton fantasma" style="margin-bottom:18px" onclick="irA(\'inicio\')">'+ico('flecha')+' Cambiar de sección</button>' +
                  pantallaSeccion();
    return;
  }
  // persona
  const p = estado.personas[personaActual];
  document.getElementById('titulo').textContent = p.nombre;
  document.getElementById('subtitulo').textContent = SECCIONES[p.seccion || seccionElegida].titulo;
  v.innerHTML = '<button class="boton fantasma" style="margin-bottom:18px" onclick="pantalla=\'seccion\';pintar()">'+ico('flecha')+' Volver a las personas</button>' +
    '<div class="pestanas">' +
    [['hoy','Hoy'],['rutina','Mi rutina'],['comer','Mi comida'],['progreso','Mi progreso']]
      .map(t => '<button class="'+(pestana===t[0]?'on':'')+'" onclick="pestana=\''+t[0]+'\';pintar()">'+t[1]+'</button>').join('') +
    '</div>' + cuerpoPersona(p);
  // barra superior con el usuario activo y el reloj
  const col = {saltar:'var(--morado)', gym:'var(--azul)', casa:'var(--teal)'}[p.seccion||'casa'];
  document.getElementById('zonaUsuario').innerHTML =
    '<button class="usuario-chip" onclick="pantalla=\'seccion\';pintar()" title="Cambiar de usuario">' +
    '<span class="ini" style="background:'+col+'">'+p.nombre.charAt(0).toUpperCase()+'</span>' +
    '<span>'+p.nombre+'</span>'+ico('cambiar')+'</button>';
  reloj();
}
function reloj(){
  const el = document.getElementById('reloj'); if(!el) return;
  const d = new Date();
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
  el.textContent = h + ':' + m + ' ' + ap;
}

function pantallaInicio(){
  return '<div class="hero"><h1>¿Qué vamos a hacer hoy?</h1>' +
    '<p>Selecciona tu sesión para comenzar en la sala</p></div>' +
    '<div class="secciones">' +
    Object.keys(SECCIONES).map(k => {
      const s = SECCIONES[k];
      return '<div class="tarjeta opcion foco" onclick="entrarSeccion(\''+k+'\')">' +
        '<div class="izq"><div class="placa" style="background:'+s.tinte+';color:'+s.color+'">'+ico(s.ico)+'</div>' +
        '<div class="txt"><b>'+s.titulo+(s.etiqueta?'<span class="etiqueta" style="background:'+s.tinte+';color:'+s.color+'">'+s.etiqueta+'</span>':'')+'</b>' +
        '<small>'+s.texto+'</small></div></div>' +
        '<div class="flecha">'+ico('flecha')+'</div></div>';
    }).join('') + '</div>' +
    '<div class="aviso" style="text-align:center;margin-top:28px">Cada persona ve solo su usuario, su rutina, su comida y su progreso.</div>';
}

function entrarSeccion(k){
  seccionElegida = k; personaActual = null; pantalla = 'seccion'; pintar();
}

function pantallaSeccion(){
  const deEsta = Object.keys(estado.personas).filter(id => (estado.personas[id].seccion||'casa') === seccionElegida);
  const COL = {saltar:'var(--morado)', gym:'var(--azul)', casa:'var(--teal)'};
  let h = '';
  if(seccionElegida === 'gym'){
    h += '<div class="tarjeta plana"><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">' +
      '<div class="placa" style="background:var(--tin-azul);color:var(--azul)">'+ico('pesa')+'</div>' +
      '<div style="flex:1;min-width:240px"><b style="font-size:28px;font-weight:600;display:block">Abrir el gimnasio completo</b>' +
      '<div class="aviso" style="margin-top:4px">openGym vive en el servidor de la casa. Se abre en el navegador con tu usuario y contraseña.</div></div>' +
      '<a href="'+URL_OPENgym+'" target="_blank" rel="noopener"><button class="boton grande">'+ico('pesa')+' Abrir openGym</button></a></div>' +
      '<div class="aviso">Solo funciona conectado al wifi de la casa. Si no abre, avisa que el servidor está apagado.</div></div>';
  }
  h += '<h2 style="border:0;padding:0;font-size:36px;font-weight:700;letter-spacing:-.01em;margin:28px 0 18px">¿Quién va a entrenar?</h2>';
  if(!deEsta.length){
    h += '<div class="tarjeta vacio">'+ico('familia')+'<div>No hay nadie en esta sección todavía.<br>Agrega la primera persona.</div></div>';
  } else {
    h += '<div class="personas">' + deEsta.map(id => {
      const p = estado.personas[id];
      return '<div class="tarjeta per foco" onclick="abrirPersona(\''+id+'\')">' +
        '<div class="ini" style="background:'+COL[seccionElegida]+'">'+p.nombre.charAt(0).toUpperCase()+'</div>' +
        '<b>'+p.nombre+'</b>' +
        '<small>'+(p.peso?p.peso+' kg':'sin peso')+' · '+(p.rutina&&p.rutina.length?p.rutina.length+' ejercicios':'sin rutina')+'</small></div>';
    }).join('') + '</div>';
  }
  h += '<div class="personas" style="margin-top:20px"><div class="tarjeta per agregar foco" onclick="agregarPersona()">' +
    '<div class="ini">'+ico('mas')+'</div><b>Agregar persona</b>' +
    '<small>Se puede editar y borrar cuando quieras</small></div></div>';
  return h;
}

function abrirPersona(id){ personaActual = id; pestana = 'hoy'; pantalla = 'persona'; pintar(); }

/* ══════════════ 3. PERSONAS ══════════════ */
function agregarPersona(){
  const nombre = prompt('¿Cómo se llama?');
  if(!nombre) return;
  const id = nuevoId();
  estado.personas[id] = {
    nombre:nombre, sexo:'m', seccion:seccionElegida || 'casa',
    edad:'', talla:'', peso:'', pulso:'', act:'1.375', meta:'bajar',
    rutina:[], registro:{}, historial:[], semana:1, creado:hoy()
  };
  guardar(estado); personaActual = id; pestana='hoy'; pantalla='persona'; pintar();
}
function editarPersona(){
  const p = estado.personas[personaActual];
  const modalEl = document.getElementById('modalPersona') || crearModalPersona();
  document.getElementById('epNombre').value = p.nombre || '';
  document.getElementById('epEdad').value = p.edad || '';
  document.getElementById('epTalla').value = p.talla || '';
  document.getElementById('epPeso').value = p.peso || '';
  document.getElementById('epGrasa').value = p.grasa || '';
  document.getElementById('epPulso').value = p.pulso || '';
  document.getElementById('epSexo').value = p.sexo || 'm';
  document.getElementById('epMeta').value = p.meta || 'bajar';
  modalEl.style.display = 'flex';
}

  const div = document.createElement('div');
  div.id = 'modalPersona';
  div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;';
  div.innerHTML = `<div style="background:var(--tarjeta);padding:32px;border-radius:24px;width:100%;max-width:500px;box-shadow:var(--s-foco);max-height:90vh;overflow-y:auto;">

    <p style="color:var(--t2);margin-bottom:20px;">Actualiza tus medidas para calcular nutrición y progreso.</p>
    <div style="display:flex;flex-direction:column;gap:16px;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

        <div><label style="font-weight:600;display:block;margin-bottom:6px;">Estatura / Talla (cm)</label><input id="epTalla" type="number" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;font-size:16px;"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label style="font-weight:600;display:block;margin-bottom:6px;">Peso actual (kg)</label><input id="epPeso" type="number" step="0.1" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;font-size:16px;"></div>
        <div><label style="font-weight:600;display:block;margin-bottom:6px;">Grasa corporal (%)</label><input id="epGrasa" type="number" step="0.1" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;font-size:16px;"></div>
      </div>

/* ══════════════ 4. NÚMEROS (puro, para probar) ══════════════ */
function calcNutricion(p){
  if(!(p.peso && p.talla && p.edad)) return null;
  const esHombre = (p.sexo === 'h');
  const tmb = (10*p.peso) + (6.25*p.talla) - (5*p.edad) + (esHombre ? 5 : -161);
  const mantener = tmb * parseFloat(p.act || 1.375);
  let objetivo = mantener;
  if(p.meta === 'bajar') objetivo = mantener - 400;
  if(p.meta === 'subir') objetivo = mantener + 300;
  if(objetivo < tmb) objetivo = tmb;
  const prot = p.peso * 2.0, gras = (objetivo*0.25)/9;
  let carb = (objetivo - prot*4 - gras*9)/4; if(carb < 50) carb = 50;
  return {
    mantener:Math.round(mantener), objetivo:Math.round(objetivo),
    proteina:Math.round(prot), carbos:Math.round(carb), grasas:Math.round(gras),
    agua:+( (p.peso*35)/1000 ).toFixed(1),
    vasos: Math.max(6, Math.round((p.peso*35)/250)),
    porSemana:[+(p.peso*0.005).toFixed(2), +(p.peso*0.01).toFixed(2)]
  };
}
function calcZonas(p){
  const pulso = p.pulso || 70;
  const reserva = (220 - p.edad) - pulso;
  const z = (x) => Math.round(reserva*(x/100) + pulso);
  return { z2:[z(60),z(70)], z3:[z(70),z(80)], max:Math.round(220-p.edad) };
}

/* ══════════════ 5. RACHA Y PROGRESO (puro) ══════════════ */
function calcRacha(registro){
  const dias = Object.keys(registro || {}).filter(f => registro[f] && registro[f].cerrado);
  if(!dias.length) return 0;
  const set = new Set(dias);
  const d = new Date(); let n = 0;
  // empieza por hoy; si hoy no está, empieza por ayer (la racha sigue viva)
  if(!set.has(fechaISO(d))){
    d.setDate(d.getDate()-1);
    if(!set.has(fechaISO(d))) return 0;
  }
  while(set.has(fechaISO(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function fechaISO(d){ return d.toISOString().slice(0,10); }
function diasCerrados(registro){ return Object.keys(registro||{}).filter(f=>registro[f]&&registro[f].cerrado).length; }
function resumenSemana(registro){
  const desde = new Date(); desde.setDate(desde.getDate()-6);
  let dias=0, agua=0, n=0;
  for(let i=0;i<7;i++){
    const f = fechaISO(new Date(desde.getTime()+i*86400000));
    const r = registro && registro[f];
    if(r && r.cerrado) dias++;
    if(r && r.agua){ agua += r.agua; n++; }
  }
  return { dias:dias, aguaPromedio: n ? Math.round(agua/n) : 0 };
}

function reg(p){ if(!p.registro) p.registro = {}; const f = hoy();
  if(!p.registro[f]) p.registro[f] = {hice:false, comi:false, agua:0, cerrado:false}; return p.registro[f]; }
function marcar(campo){
  const p = estado.personas[personaActual], r = reg(p);
  r[campo] = !r[campo];
  if(r.hice && r.comi && r.agua >= (calcNutricion(p)?calcNutricion(p).vasos:6)) r.cerrado = true;
  else r.cerrado = false;
  guardar(estado); pintar();
}
function tomarAgua(){
  const p = estado.personas[personaActual], r = reg(p);
  const meta = calcNutricion(p) ? calcNutricion(p).vasos : 8;
  r.agua = (r.agua % (meta+1)) === meta ? 0 : r.agua + 1;   // al pasar la meta vuelve a 0
  if(r.hice && r.comi && r.agua >= meta) r.cerrado = true; else r.cerrado = false;
  guardar(estado); pintar();
}

function sumarVaso(){

  'bosu','polea','máquina','máquina smith','rodillo','cuerda','rueda','martillo','barra','llanta','bicicleta'];

function nombreES(n){
  if(!n) return n;
  let s = ' ' + String(n).toLowerCase() + ' ';
  const claves = Object.keys(TRAD).sort((a,b) => b.length - a.length);
  claves.forEach(k => {
    // ojo: un valor vacío ('male' → '') SÍ se debe aplicar (borra la palabra)
    if(!Object.prototype.hasOwnProperty.call(TRAD, k)) return;
    const re = new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','g');
    s = s.replace(re, ' ' + TRAD[k] + ' ');
  });
  let tok = s.replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  // quita los signos sueltos que dejan los paréntesis vacíos
  tok = tok.filter(t => !/^[()\[\]{}.,;:·-]+$/.test(t));
  if(!tok.length) return String(n);

  // 1) busca el sustantivo principal (el último que aparezca)
  let idx = -1, largo = 0;
  tok.forEach((t,i) => {
    SUSTANTIVOS.forEach(sus => {
      if(t === sus && sus.length >= largo){ idx = i; largo = sus.length; }
    });
  });

  if(idx > 0){
    const nucleo = tok[idx];
    const antes = tok.slice(0, idx);
    const despues = tok.slice(idx+1);
    // las direcciones van pegadas al sustantivo
    const dirs = [], resto = [];
    antes.forEach(t => { (DIRECCION.indexOf(t)>=0 ? dirs : resto).push(t); });
    let out = [nucleo].concat(dirs).concat(despues);
    if(resto.length){
      const eq = resto.filter(t => EQUIPO_PAL.indexOf(t)>=0);
      const otros = resto.filter(t => EQUIPO_PAL.indexOf(t)<0);
      if(eq.length) out.push('con ' + eq.join(' y '));
      if(otros.length) out.push(otros.join(' '));
    }
    return capitalizar(out.join(' ').replace(/\s+/g,' ')
      .replace(/\bde de\b/g,'de').replace(/\bcon con\b/g,'con').trim());
  }
  return capitalizar(tok.join(' ').replace(/\s+/g,' ').trim());
}
function capitalizar(t){ return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
function zonaES(z){ return TRAD[z] ? TRAD[z] : z; }
function equipoES(e){ return TRAD[e] ? TRAD[e] : e; }

/* ---- FILTRO DE SEGURIDAD (obligatorio) ----
   La biblioteca trae movimientos de gimnasio avanzado (planchas, muscle up,
   front lever, handstand) que NO se deben dar a alguien que empieza en casa,
   y otros que piden barra, jaula de fondos o máquina que la casa no tiene. */
const PELIGROSO = /back lever|front lever|human flag|muscle up|muscle-up|planche|handstand|iron cross|one arm pull|dragon flag|skin the cat|torque|neck|splits|sphynx|shrimp/i;
const PIDE_EQUIPO = /pull-?up|chin-?up|\bdip\b|cage|\bbar\b|rope|sled|ergometer|stationary bike|elliptical|stepmill|trap bar|smith|wheel roller|skierg|roller|wheel/i;
const NO_ES_ENTRENO = /stretch|circle|wave|twist|hold|breath|massage/i;

function esSeguro(ej){
  const n = (ej.n || ej.name || '');
  if(PELIGROSO.test(n))  return {ok:false, por:'movimiento avanzado, no para empezar'};
  if(PIDE_EQUIPO.test(n)) return {ok:false, por:'necesita barra o máquina que no hay en casa'};
  return {ok:true};
}
function candidatosSeguros(zonas, equipos){
  return BIBLIOTECA.filter(x =>
    (zonas ? zonas.indexOf(x.z) >= 0 : true) &&
    equipos.indexOf(x.e) >= 0 &&
    esSeguro(x).ok &&
    !NO_ES_ENTRENO.test(x.n)
  );
}
function semanaDe(p){ return Math.min(4, Math.max(1, parseInt(p.semana)||1)); }
function armarRutina(){
  const p = estado.personas[personaActual];
  if(typeof BIBLIOTECA === 'undefined'){ alert('No se encontró la biblioteca de ejercicios (biblioteca.js).'); return; }
  const meta = prompt('¿Qué buscas?\n1 = fuerza\n2 = bajar de peso\n3 = mantenerme','2') || '2';
  const clave = (meta==='1') ? 'fuerza' : (meta==='3' ? 'mantener' : 'bajar');
  const dias = parseInt(prompt('¿Cuántos días a la semana? (3 a 6)','3') || '3', 10) || 3;
  const eqs = prompt('¿Qué equipo tienes?\n1 = solo mi cuerpo\n2 = cuerpo + una pesa\n3 = cuerpo + pesa + banda','2') || '2';
  const permitidos = (eqs==='1') ? ['body weight']
                   : (eqs==='3') ? ['body weight','dumbbell','band','kettlebell','weighted']
                   : ['body weight','dumbbell','weighted'];
  const nv = NIVELES[semanaDe(p)];
  const zonas = ZONAS[clave];
  const rutina = [];
  let usados = 0;
  // busca por zona, solo ejercicios seguros y con el equipo de la casa
  zonas.forEach(z => {
    const cand = candidatosSeguros([z], permitidos);
    if(!cand.length) return;
    // rota para no dar siempre el mismo
    const ej = cand[usados % cand.length]; usados++;
    rutina.push({
      nombre:ej.n, nombreES:nombreES(ej.n), zona:ej.z, equipo:ej.e, gif:ej.g, instr:ej.i,
      series:nv.series, reps:nv.reps, descanso:nv.descanso, seg:45
    });
  });
  // completa hasta 6 ejercicios con lo que sobre (siempre seguro)
  if(rutina.length < 6){
    const cand = candidatosSeguros(null, permitidos);
    let vueltas = 0;
    while(rutina.length < 6 && cand.length && vueltas < cand.length){
      const ej = cand[(usados + vueltas) % cand.length]; vueltas++;
      if(rutina.some(r => r.nombre === ej.n)) continue;
      rutina.push({nombre:ej.n, nombreES:nombreES(ej.n), zona:ej.z, equipo:ej.e, gif:ej.g, instr:ej.i,
        series:nv.series, reps:nv.reps, descanso:nv.descanso, seg:45});
    }
  }
  p.rutina = rutina;
  p.metaRutina = clave; p.diasSemana = dias;
  guardar(estado); pintar();
  alert('Listo: ' + rutina.length + ' ejercicios.\nSemana ' + semanaDe(p) + ' (' + nv.nota + '): ' +
        nv.series + ' series × ' + nv.reps + ' repeticiones, descanso ' + nv.descanso + ' segundos.\n\n' +
        'Cuando la termines bien, súbela de semana en «Mi progreso».');
}
function subirSemana(){
  const p = estado.personas[personaActual];
  if(semanaDe(p) >= 4){ alert('Ya estás en la semana 4, la más cargada. Aguanta ahí y descansa cuando el cuerpo lo pida.'); return; }
  p.semana = semanaDe(p) + 1;
  // recalcula la rutina con la nueva semana
  const nv = NIVELES[semanaDe(p)];
  (p.rutina||[]).forEach(it => { it.series=nv.series; it.reps=nv.reps; it.descanso=nv.descanso; });
  guardar(estado); pintar();
  alert('¡Subiste a la semana ' + p.semana + '! Ahora: ' + nv.series + ' series × ' + nv.reps +
        ' repeticiones, descanso ' + nv.descanso + ' segundos.');
}

/* ══════════════ 8. BIBLIOTECA ══════════════ */
let bib = null;
function abrirModal(){
  document.getElementById('modal').classList.add('visible');
  if(bib){ prepararFiltros(); filtrar(); return; }
  if(typeof BIBLIOTECA !== 'undefined' && BIBLIOTECA.length){
    bib = BIBLIOTECA.map(x => ({name:x.n, body_part:x.z, equipment:x.e, gif:x.g, instr:x.i}));
    document.getElementById('estadoBib').style.display='none';
    prepararFiltros(); filtrar(); return;
  }
  document.getElementById('estadoBib').innerHTML =
    '❌ No se encontró <b>biblioteca.js</b>. Debe estar en la misma carpeta que esta app.';
}
function cerrarModal(){ document.getElementById('modal').classList.remove('visible'); }
function prepararFiltros(){
  document.getElementById('zona').innerHTML = '<option value="">Todas</option>' +
    [...new Set(bib.map(x=>x.body_part))].sort().map(z=>'<option>'+z+'</option>').join('');
  document.getElementById('equipo').innerHTML = '<option value="">Todos</option>' +
    [...new Set(bib.map(x=>x.equipment))].sort().map(e=>'<option>'+e+'</option>').join('');
}
function filtrar(){
  if(!bib) return;
  const q = (document.getElementById('buscar').value||'').toLowerCase();
  const z = document.getElementById('zona').value, e = document.getElementById('equipo').value;
  const soloSeguro = document.getElementById('soloSeguro').checked;
  let res = bib.filter(x => (!q || x.name.toLowerCase().includes(q)) &&
    (!z || x.body_part===z) && (!e || x.equipment===e));
  if(soloSeguro) res = res.filter(x => esSeguro(x).ok && !NO_ES_ENTRENO.test(x.name));
  res = res.slice(0,40);
  document.getElementById('listaBib').innerHTML = res.length ? res.map(x =>
    '<div class="res"><img src="'+x.gif+'" alt="" loading="lazy">' +
    '<div style="flex:1"><b>'+nombreES(x.name)+'</b><br><small>'+zonaES(x.body_part)+' · '+equipoES(x.equipment)+'</small></div>' +
    '<button class="mini" onclick="agregarEj(\''+x.name.replace(/'/g,'')+'\')">+ Agregar</button></div>'
  ).join('') : '<div class="cargando">Sin resultados.</div>';
  document.getElementById('cuentaBib').textContent = res.length + ' de ' + bib.length + ' ejercicios';
}
function agregarEj(nombre){
  const ej = bib.find(x => x.name === nombre); if(!ej) return;
  const p = estado.personas[personaActual];
  const nv = NIVELES[semanaDe(p)];
  p.rutina.push({nombre:ej.name, nombreES:nombreES(ej.name), zona:ej.body_part, equipo:ej.equipment,
    gif:ej.gif, instr:ej.instr, series:nv.series, reps:nv.reps, descanso:nv.descanso, seg:45});
  guardar(estado); cerrarModal(); pintar();
}

function pestanaComer(p){
  const n = calcNutricion(p);

    h += '<h2>El plato saludable (ICBF)</h2><div class="tarjeta">' +

      '<b style="font-size:15px;display:block;margin-top:10px">Un cuarto</b><div style="font-size:13px;color:var(--gris)">Arroz, papa, yuca o pasta</div>' +
      '<b style="font-size:15px;display:block;margin-top:10px">Un cuarto</b><div style="font-size:13px;color:var(--gris)">Pescado, pollo, huevo o fríjol</div>' +
      '</div></div></div>';
    const menu = PLATO[p.meta] || PLATO.bajar;

    h += '</table></div>';

         'Precisión ±10%. <b>No es un diagnóstico médico ni una dieta recetada.</b> ' +

}

/* ══════════════ 10. PROGRESO ══════════════ */
function pestanaProgreso(p){
  const n = calcNutricion(p), rs = resumenSemana(p.registro);
  let h = '<h2>Mi progreso</h2>';
  h += '<div class="racha">' +
    '<div class="chip"><b>'+calcRacha(p.registro)+'</b><small>días seguidos</small></div>' +
    '<div class="chip"><b>'+diasCerrados(p.registro)+'</b><small>días cerrados</small></div>' +
    '<div class="chip"><b>'+rs.dias+'/7</b><small>esta semana</small></div>' +
    '<div class="chip"><b>'+(rs.aguaPromedio||'-')+'</b><small>vasos de agua al día</small></div>' +
    '</div>';
  h += '<div class="dias">' + ultimosDias(p.registro, 28) + '</div>';

  const hist = (p.historial||[]).slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(hist.length > 1){
    h += '<h2>Mi peso</h2><div class="tarjeta"><table>';
    hist.slice().reverse().slice(0,14).forEach(x => { h += '<tr><td>'+x.fecha+'</td><td>'+x.peso+' kg</td></tr>'; });
    h += '</table>';
    const dif = (hist[hist.length-1].peso - hist[0].peso).toFixed(1);
    h += '<div style="margin-top:10px;font-size:15px"><b>Cambio desde el inicio: ' +
         (dif>0?'+':'') + dif + ' kg</b></div></div>';
    if(n){
      h += '<div class="tarjeta"><b>Ritmo actual</b><div style="font-size:14px;color:var(--gris);margin-top:6px">' +
        pesoRitmo(hist) + '</div></div>';
    }
  }
  const nv = NIVELES[semanaDe(p)];
  h += '<h2>Mi semana de entrenamiento</h2><div class="tarjeta">' +
    '<b style="font-size:17px">Semana '+semanaDe(p)+' de 4</b>' +
    '<div style="font-size:14px;color:var(--gris);margin:6px 0 10px">'+nv.nota+' · ' +
    nv.series+' series × '+nv.reps+' repeticiones · descanso '+nv.descanso+' segundos</div>' +
    '<button class="boton verde" onclick="subirSemana()">⬆ Terminé bien la semana, subir de nivel</button>' +
    '<div class="aviso">Sube solo si terminaste todas las series sin dolor y con buena técnica. ' +
    'Si quedaste muy cansado, repite la semana.</div></div>';
  h += '<div class="tarjeta"><b>Mis datos guardados</b>' +
    '<div style="font-size:13px;color:var(--gris);margin:6px 0 10px">Descarga una copia por si se limpia el navegador.</div>' +
    '<button class="boton" onclick="descargarRespaldo()">⬇ Descargar mi respaldo</button></div>';
  return h;
}
function pesoRitmo(hist){
  const dias = (new Date(hist[hist.length-1].fecha) - new Date(hist[0].fecha)) / 86400000;
  const dif = hist[hist.length-1].peso - hist[0].peso;
  if(dias < 7) return 'Registra tu peso unos días más para ver el ritmo.';
  const sem = (dif / (dias/7));
  const bueno = (hist[hist.length-1].peso > hist[0].peso) ? sem > 0 : sem < 0;
  return (sem>=0?'+':'') + sem.toFixed(2) + ' kg por semana' +
    (bueno ? ' — vas en la dirección correcta.' : ' — ojo, no es el ritmo que buscabas.');
}

/* ══════════════ 12. CRONÓMETRO ══════════════ */
let t1 = null;
function pitido(freq){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; g.gain.value = 0.25;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 180);
  }catch(e){}
}
function iniciar(trabajo, descanso, vueltas){
  parar();
  let vuelta=1, enTrabajo=true, restante=trabajo, cuenta=3;
  const faseEl=document.getElementById('fase'), cuentaEl=document.getElementById('cuenta'),
        tiempoEl=document.getElementById('tiempo');
  faseEl.textContent='Prepárate';
  const tick = () => {
    if(cuenta>0){ cuentaEl.textContent=cuenta; pitido(cuenta===1?880:440); cuenta--; return; }
    cuentaEl.textContent='';
    faseEl.textContent = enTrabajo ? ('¡TRABAJA! · vuelta '+vuelta+'/'+vueltas) : 'Descansa';
    tiempoEl.textContent = '0:' + String(restante).padStart(2,'0');
    if(restante<=3 && restante>0) pitido(660);
    if(restante===0){
      if(enTrabajo){ enTrabajo=false; restante=descanso; pitido(1000); }
      else{
        if(vuelta>=vueltas){ clearInterval(t1); t1=null; faseEl.textContent='¡Terminado!';
          tiempoEl.textContent='0:00'; return; }
        vuelta++; enTrabajo=true; restante=trabajo; pitido(1000);
      }
      return;
    }
    restante--;
  };
  tick(); t1 = setInterval(tick, 1000);
}
function parar(){
  if(t1){ clearInterval(t1); t1=null; }
  document.getElementById('fase').textContent='Cronómetro listo';
  document.getElementById('cuenta').textContent='';
}
